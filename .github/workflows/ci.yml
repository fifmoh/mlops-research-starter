name: ci
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
      - run: make setup
      - run: make check test docs smoke
      - run: uv run cyclonedx-py environment --output-format JSON -o sbom.cdx.json
